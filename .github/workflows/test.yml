name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate schema fixtures
        run: python3 scripts/schema_check.py --fixtures
      - name: Compile Python entry points
        run: python3 -m py_compile memory_workspace/*.py scripts/*.py adapters/codex/*.py
